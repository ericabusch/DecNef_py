[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decnef"
version = "0.1.0"
description = "Real-time fMRI decoded neurofeedback (DecNef) pipeline"
readme = "readme.txt"
requires-python = ">=3.10"
# Core runtime dependencies. torch, PyQt5, pyserial, pandas and matplotlib are
# core (not extras) because fmri_rt_preproc/RTPSpy_tools/rtp_common.py,
# rtp_volreg.py and rtp_regress.py import them at module level and
# rt_pipeline.py / run_preproc.py import those. Lower bounds only; no pins.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5.0",
    "nilearn>=0.10",
    "torch>=2.0",
    "watchdog>=3.0",
    "six>=1.16",
    "PyQt5>=5.15",
    "pyserial>=3.5",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# PsychoPy displays (decnef.display, examples/)
task = ["psychopy>=2023.2", "pyglet"]
# offline analysis helpers (roi_rs_pca_decoder_prep uses sklearn if present; compare_decoders uses h5py)
analysis = ["scikit-learn>=1.3", "h5py>=3"]
dev = ["pytest>=7"]
# scanner-level simulation writes DICOMs (decnef simulate --level scanner); dcm2niix itself is an external tool
sim = ["pydicom>=2.4"]

[tool.setuptools]
# src layout: the new package. The old flat modules (rt_pipeline.py, ...) stay in
# the repo as the reference implementation and run from the repo root, but are
# not part of the distribution any more.
package-dir = {"" = "src"}
packages = ["decnef", "decnef.rtpspy"]
include-package-data = false

[tool.setuptools.package-data]
"decnef.rtpspy" = ["librtp.so", "librtp.dylib"]

[project.scripts]
decnef = "decnef.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
